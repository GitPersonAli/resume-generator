# knowledge.yaml - resume-generator data source (single source of truth)
#
# Replace every <PLACEHOLDER> with your real data. Placeholders look like
# <UPPER_CASE_WORDS>, sometimes with digits (<TECH_1>). The generator detects
# them with the regex  <[A-Z][A-Za-z0-9_]*>  and refuses to generate while a
# REQUIRED field still holds one. Optional fields left as placeholders are
# treated as empty (they never reach the PDF), but deleting them keeps the
# file clean. Optional sections may be deleted entirely.
#
# Strings with special characters (#, :, &, %, etc.) should be quoted.
# Use ">" for multi-line strings (folded - newlines collapse to spaces).
# Use "|" for multi-line strings (literal - newlines preserved).
#
# Validate at any time:  bash <SKILL_ROOT>/tests/validate-knowledge.sh knowledge.yaml
#
# ====== `evidence:` convention (deep-dive pointers) ======
#
# Any entry under `experience`, `projects`, `education`, `teaching`,
# `certifications`, `publications`, `events`, etc. may carry an optional
# `evidence:` list of local paths or URLs that point to richer raw material:
# a code repo, a project README, a postmortem, a portfolio dir, a thesis PDF,
# scanned notes, whatever. The resume-generator will NOT inline these into the
# resume; they stay outside the YAML.
#
# What they enable:
#   1. When a job posting is in context and an item looks highly relevant, the
#      generator dispatches a deep-dive sub-agent to read the `evidence:` and
#      return sharper achievements / quantifications / tech-stack details
#      tailored to that specific posting.
#   2. When you bootstrap from a directory (onboarding Branch 1 with sources), the import
#      sub-agent populates `evidence:` automatically with pointers back to the
#      dirs/files it summarized, so future deep-dives stay reproducible.
#
# Format: list of strings (paths or URLs). Paths may be absolute or relative
# to the directory containing this knowledge.yaml. Globs are allowed.
# Secret-looking files (.env, *.pem, *.key, id_*, *credential*) are never read.
#   evidence:
#     - "./projects/ml-platform/"        # local code repo
#     - "~/Documents/ml-eng-self-eval.pdf"
#     - "https://github.com/me/old-project"
#     - "./notes/postmortems/*.md"
#
# ====== `tags:` / `pin:` (tailoring hints, optional) ======
#
# `tags:` free-form labels (e.g. [backend, ml, leadership]) that the generator
# matches against the job posting when deciding what to keep and what to cut.
# `pin: true` forces an entry onto every resume regardless of the posting.

# ====== Personal info (REQUIRED) ======
name: "<YOUR_NAME>"                # REQUIRED
email: "<YOUR_EMAIL>"              # REQUIRED
phone: "<YOUR_PHONE>"              # optional - delete line if not used
location: "<YOUR_CITY_COUNTRY>"    # optional
linkedin: "<YOUR_LINKEDIN_URL>"    # optional - full URL
github: "<YOUR_GITHUB_URL>"        # optional - full URL
website: "<YOUR_WEBSITE_URL>"      # optional - full URL

# Only used by European/UK-style templates (4 ModernCV, 5 Wilson). Delete otherwise.
date_of_birth: "<YYYY_MM_DD_OR_DELETE>"   # optional
nationality: "<NATIONALITY_OR_DELETE>"    # optional
photo: "<PATH_TO_PHOTO_OR_DELETE>"        # optional - Template 4 only; jpg/png, path relative to this file

# ====== Output preferences (optional) ======
language: en            # resume language: en, it, de, fr, es. Section headings are translated; body text is emitted as you wrote it.
page_limit: "<PAGE_LIMIT_1_OR_2_OR_DELETE>"   # optional - overrides the template's default page budget (1 for templates 2/6, 2 otherwise)

# ====== Profile / summary (optional but recommended) ======
profile: >
  <YOUR_PROFESSIONAL_SUMMARY_2_TO_4_SENTENCES>

# ====== Research interests (optional, useful for academic CVs) ======
research_interests:
  - "<RESEARCH_TOPIC_1>"
  - "<RESEARCH_TOPIC_2>"

# ====== Education (REQUIRED - at least one entry with degree + university) ======
education:
  - degree: "<DEGREE_NAME_E_G_MSc_in_X>"      # REQUIRED
    university: "<UNIVERSITY_NAME>"           # REQUIRED
    location: "<CITY_COUNTRY_OR_DELETE>"
    years: "<YYYY_DASH_YYYY_OR_RANGE>"        # display string, e.g. "2019 - 2021"
    start: "<YYYY_MM_OR_DELETE>"              # optional ISO date used for sorting, e.g. "2019-09"
    end: "<YYYY_MM_OR_PRESENT_OR_DELETE>"     # optional, "present" allowed
    details:
      - "<COURSEWORK_GPA_HONORS_LINE_1>"
      - "<COURSEWORK_GPA_HONORS_LINE_2>"
    tags: ["<TAG_1>"]
    # optional `evidence:` - local paths the deep-dive sub-agent can read
    # for richer thesis context, transcripts, syllabi, etc.
    evidence:
      - "<PATH_TO_THESIS_PDF_OR_TRANSCRIPT_OR_DELETE>"
    # thesis is optional - delete this block if not applicable
    thesis:
      title: "<THESIS_TITLE>"
      status: "<IN_PROGRESS_OR_COMPLETED>"
      collaboration: "<COLLABORATING_INSTITUTION_OR_DELETE>"
      description: >
        <THESIS_ABSTRACT_OR_GOAL>
      keywords: ["<KEYWORD_1>", "<KEYWORD_2>"]

# ====== Experience (REQUIRED - at least one entry with title + company, OR projects must have entries) ======
experience:
  - title: "<JOB_TITLE>"                      # REQUIRED (for the entry to count)
    company: "<COMPANY_NAME>"                 # REQUIRED (for the entry to count)
    website: "<COMPANY_URL_OR_DELETE>"
    years: "<MONTH_YYYY_DASH_MONTH_YYYY_OR_PRESENT>"   # display string
    start: "<YYYY_MM_OR_DELETE>"              # optional ISO date for sorting
    end: "<YYYY_MM_OR_PRESENT_OR_DELETE>"
    company_location: "<CITY_COUNTRY>"
    work_mode: "<REMOTE_ONSITE_OR_HYBRID>"
    technologies: ["<TECH_1>", "<TECH_2>"]
    achievements:
      - "<QUANTIFIED_ACHIEVEMENT_1>"
      - "<QUANTIFIED_ACHIEVEMENT_2>"
    tags: ["<TAG_1>", "<TAG_2>"]
    pin: false
    # optional - point to repos, design docs, postmortems, perf reviews
    evidence:
      - "<PATH_TO_REPO_OR_DOC_OR_DELETE>"

# ====== Teaching (optional) ======
teaching:
  - title: "<TEACHING_ROLE>"
    organization: "<ORGANIZATION_OR_PLATFORM>"
    years: "<YYYY_OR_RANGE>"
    location: "<ONLINE_OR_LOCATION>"
    achievements:
      - "<TEACHING_ACHIEVEMENT_1>"
    link: "<COURSE_OR_CHANNEL_URL_OR_DELETE>"
    tags: ["<TAG_1>"]
    evidence:
      - "<PATH_TO_COURSE_MATERIALS_OR_DELETE>"

# ====== Projects (REQUIRED if no experience entries; each counted entry needs a name) ======
projects:
  - name: "<PROJECT_NAME>"                    # REQUIRED (for the entry to count)
    description: >
      <PROJECT_DESCRIPTION>
    technologies: ["<TECH_1>", "<TECH_2>"]
    link: "<PROJECT_URL_OR_DELETE>"
    years: "<YYYY_OR_RANGE_OR_DELETE>"
    start: "<YYYY_MM_OR_DELETE>"
    end: "<YYYY_MM_OR_PRESENT_OR_DELETE>"
    achievements:
      - "<PROJECT_OUTCOME_OR_METRIC>"
    tags: ["<TAG_1>"]
    pin: false
    # optional - point to local repo / writeup / demo dir
    evidence:
      - "<PATH_TO_PROJECT_DIR_OR_DELETE>"

# ====== Skills (recommended) ======
skills:
  professional: ["<SOFT_OR_DOMAIN_SKILL_1>", "<SOFT_OR_DOMAIN_SKILL_2>"]
  programming: ["<LANGUAGE_1>", "<LANGUAGE_2>"]
  frameworks: ["<FRAMEWORK_1>", "<FRAMEWORK_2>"]
  tools: ["<TOOL_1>", "<TOOL_2>"]
  languages:
    - name: "<LANGUAGE_NAME>"
      level: "<NATIVE_PROFESSIONAL_OR_LEVEL>"
      certificate: "<CERT_NAME_AND_DATE_OR_DELETE>"

# ====== Certifications (optional) ======
certifications:
  - name: "<CERTIFICATION_NAME>"
    provider: "<ISSUING_ORGANIZATION>"
    link: "<CERTIFICATE_URL_OR_DELETE>"
    issued: "<MONTH_YYYY>"
    evidence:
      - "<PATH_TO_CERT_FILE_OR_DELETE>"

# ====== Awards (optional) ======
awards:
  - "<AWARD_NAME_AND_YEAR>"

# ====== Publications (optional - academic CVs; Template 3 renders a DOI table) ======
publications:
  - title: "<PUBLICATION_TITLE>"
    authors: "<AUTHORS_AS_PRINTED_E_G_Doe_J_Smith_A>"   # your own name is bolded automatically
    venue: "<JOURNAL_OR_CONFERENCE_NAME>"
    year: "<YYYY>"
    type: "<JOURNAL_CONFERENCE_PREPRINT_THESIS_OR_TALK>"
    doi: "<DOI_OR_DELETE>"
    url: "<URL_OR_DELETE>"
    first_author: false
    evidence:
      - "<PATH_TO_PDF_OR_DELETE>"

# ====== References (optional - Templates 3 and 5 have referee sections) ======
references:
  - name: "<REFEREE_NAME>"
    position: "<REFEREE_POSITION>"
    organization: "<REFEREE_ORGANIZATION>"
    email: "<REFEREE_EMAIL_OR_DELETE>"
    phone: "<REFEREE_PHONE_OR_DELETE>"

# ====== Interests (optional - short list, used by Templates 4/5/6) ======
interests:
  - "<INTEREST_1>"

# ====== Events / talks (optional) ======
# Free-form section for things that don't fit above. Each entry is an object
# with at least `name` + `date`; everything else (including `evidence:`) is
# optional. Delete the section if unused.
events:
  - name: "<EVENT_OR_TALK_TITLE>"
    date: "<MONTH_YYYY>"
    venue: "<VENUE_OR_ORGANIZER>"
    description: >
      <ONE_LINE_DESCRIPTION>
    evidence:
      - "<PATH_TO_SLIDES_OR_RECORDING_OR_DELETE>"
